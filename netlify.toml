# Netlify hosts the IndianLawGPT frontend only (static React build).
# The API (FastAPI + legal database + model engines) must run elsewhere; see docs/DEMO.md.

[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# When the API is hosted somewhere public, forward /api to it (uncomment and set the URL).
# This rule must stay above the SPA fallback below.
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API-HOST/api/:splat"
#   status = 200
#   force = true

# Single-page app: every page (e.g. /research/abc123) is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
